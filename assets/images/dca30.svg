<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Sombra externa da placa -->
    <filter id="drop-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .text-ufrn {
      font-family: 'Arial Black', 'Impact', 'Segoe UI', sans-serif;
      font-weight: 900;
      font-size: 38px;
      fill: #FFFFFF;
      letter-spacing: 2px;
    }
    .text-dca-left {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      font-weight: 700;
      font-size: 38px;
      fill: #FFFFFF;
      letter-spacing: 1.5px;
    }
    .text-sala {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      font-weight: 600;
      font-size: 19px;
      fill: #FFFFFF;
    }
    .text-title {
      font-family: 'Arial Black', 'Impact', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 44px;
      fill: #142334;
      letter-spacing: 1px;
    }
    .text-subtitle {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      font-weight: 700;
      font-size: 20px;
      fill: #4A6B82;
    }
  </style>

  <g filter="url(#drop-shadow)">
    <!-- Fundo Principal (Lado Direito - Off-white) -->
    <rect x="10" y="10" width="580" height="180" rx="3" ry="3" fill="#FAF9F5" />

    <!-- Retângulo Azul (Lado Esquerdo) -->
    <path d="M 13 10 H 145 V 190 H 13 A 3 3 0 0 1 10 187 V 13 A 3 3 0 0 1 13 10 Z" fill="#4B92DB" />
  </g>

  <!-- Conteúdo do Bloco Azul -->
  <text x="32" y="62" class="text-ufrn">UFRN</text>
  <text x="32" y="104" class="text-dca-left">DCA</text>
  <text x="32" y="152" class="text-sala">Sala 30</text>

  <!-- Conteúdo do Bloco Branco -->
  <text x="168" y="96" class="text-title">DCA 30 ANOS</text>
  <text x="168" y="138" class="text-subtitle">Grande Tour da Automação</text>
</svg>